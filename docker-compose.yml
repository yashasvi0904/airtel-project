# Optional PostgreSQL for the backend (default is SQLite, no setup needed).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: udyam
      POSTGRES_PASSWORD: udyam
      POSTGRES_DB: udyam
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
