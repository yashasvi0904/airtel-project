<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e40000">
<title>Offline - Udyam Digital</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#1c1c21;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  main{max-width:360px}
  .logo{width:72px;height:72px;border-radius:18px;background:#e40000;color:#fff;font-weight:700;font-size:48px;line-height:72px;margin:0 auto 20px}

<body>
<main>
  <div class="logo" aria-hidden="true">a</div>
  <h1>You are offline</h1>
  <p>Check your mobile data or Wi-Fi, then try again.</p>
  <p lang="hi">आप ऑफ़लाइन हैं। मोबाइल डेटा या वाई-फ़ाई जाँचें और फिर कोशिश करें।</p>
  <button onclick="location.reload()">Try again / फिर कोशिश करें</button>
</main>
