# Render Blueprint: backend API. Frontend is deployed on Vercel and proxies /api/* to this service.
services:
  - type: web
    name: udyam-digital-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@accel.example
      - key: ADMIN_PASSWORD
        generateValue: true   # read it in the Render dashboard > Environment
      - key: REFERENCE_DATE
        value: "2026-07-15"
      - key: LLM_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false           # optional; leave empty to run the offline advisor
      - key: GOOGLE_CLIENT_ID
        sync: false           # optional; enables "Sign in / Sign up with Google"
      - key: CORS_ORIGINS
        value: "*"
